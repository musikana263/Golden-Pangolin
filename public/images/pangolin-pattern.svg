<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <g id="pangolin-curled">
      <!-- Curled pangolin: body spiral + scale dots + head -->
      <path d="M 30 0
               C 50 0, 65 15, 65 35
               C 65 55, 50 70, 30 70
               C 10 70, -5 55, -5 35
               C -5 20, 5 8, 18 4"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Inner spiral (tail tucked) -->
      <path d="M 35 18
               C 45 22, 48 32, 42 40
               C 36 46, 26 44, 24 36"
            fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Head bump -->
      <circle cx="18" cy="4" r="3" fill="currentColor" opacity="0.6"/>
      <!-- Scale dots on outer body -->
      <circle cx="50" cy="14" r="1.2" fill="currentColor"/>
      <circle cx="58" cy="28" r="1.2" fill="currentColor"/>
      <circle cx="56" cy="46" r="1.2" fill="currentColor"/>
      <circle cx="42" cy="60" r="1.2" fill="currentColor"/>
      <circle cx="22" cy="62" r="1.2" fill="currentColor"/>
      <circle cx="6" cy="52" r="1.2" fill="currentColor"/>
      <circle cx="2" cy="34" r="1.2" fill="currentColor"/>
      <circle cx="12" cy="18" r="1.2" fill="currentColor"/>
    </g>

    <g id="pangolin-walking">
      <!-- Walking pangolin: elongated body, tail, head, legs -->
      <!-- Body (top arc) -->
      <path d="M 5 30
               C 15 14, 40 10, 60 18
               C 75 24, 78 32, 72 36"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Belly -->
      <path d="M 8 34
               C 20 40, 50 40, 68 36"
            fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Tail -->
      <path d="M 72 36 C 88 34, 92 22, 80 14"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="5" cy="32" r="3" fill="currentColor" opacity="0.6"/>
      <!-- Legs -->
      <line x1="20" y1="40" x2="20" y2="50" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="32" y1="40" x2="32" y2="50" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="50" y1="40" x2="50" y2="50" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="62" y1="38" x2="62" y2="48" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Scale dots on back -->
      <circle cx="20" cy="20" r="1.1" fill="currentColor"/>
      <circle cx="32" cy="16" r="1.1" fill="currentColor"/>
      <circle cx="44" cy="16" r="1.1" fill="currentColor"/>
      <circle cx="56" cy="20" r="1.1" fill="currentColor"/>
      <circle cx="68" cy="26" r="1.1" fill="currentColor"/>
    </g>

    <g id="pangolin-climbing">
      <!-- Climbing pangolin: vertical pose -->
      <path d="M 30 5
               C 16 15, 14 40, 22 60
               C 26 70, 32 72, 38 70"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 32 8
               C 44 16, 46 36, 40 56
               C 38 64, 36 68, 36 70"
            fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="30" cy="5" r="3" fill="currentColor" opacity="0.6"/>
      <!-- Tail curling -->
      <path d="M 38 70 C 52 74, 58 64, 50 56"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Scale dots -->
      <circle cx="22" cy="22" r="1.1" fill="currentColor"/>
      <circle cx="18" cy="36" r="1.1" fill="currentColor"/>
      <circle cx="20" cy="50" r="1.1" fill="currentColor"/>
      <circle cx="36" cy="20" r="1.1" fill="currentColor"/>
      <circle cx="40" cy="36" r="1.1" fill="currentColor"/>
      <circle cx="38" cy="52" r="1.1" fill="currentColor"/>
    </g>
  </defs>

  <g color="#d4a03c" opacity="0.55">
    <use href="#pangolin-curled" x="40" y="40"/>
    <use href="#pangolin-walking" x="160" y="60"/>
    <use href="#pangolin-climbing" x="260" y="20"/>

    <use href="#pangolin-walking" x="20" y="170" transform="scale(-1, 1) translate(-110, 0)"/>
    <use href="#pangolin-curled" x="180" y="190"/>
    <use href="#pangolin-climbing" x="260" y="180"/>
  </g>
</svg>
